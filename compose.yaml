services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mayorista
      POSTGRES_PASSWORD: mayorista_local
      POSTGRES_DB: mayorista
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayorista -d mayorista"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  catalog-data:
