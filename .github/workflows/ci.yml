name: Verificar aplicación
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mayorista
          POSTGRES_PASSWORD: mayorista_ci
          POSTGRES_DB: mayorista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mayorista -d mayorista"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mayorista:mayorista_ci@localhost:5432/mayorista
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
