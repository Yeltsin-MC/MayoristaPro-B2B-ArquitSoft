name: Verificar aplicación
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mayorista
          POSTGRES_PASSWORD: mayorista_ci
          POSTGRES_DB: mayorista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mayorista -d mayorista"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mayorista:mayorista_ci@localhost:5432/mayorista
      AI_SERVICE_URL: http://127.0.0.1:5055
      T6_AI_URL: http://127.0.0.1:5055
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - run: npm ci
      - run: python -m pip install -r apps/ai-service/requirements.txt
      - run: python -m pytest apps/ai-service/test_scoring.py -q
      - name: Iniciar FastAPI de prueba
        run: |
          python -m uvicorn main:app --app-dir apps/ai-service --host 127.0.0.1 --port 5055 > "$RUNNER_TEMP/fastapi.log" 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit('FastAPI no inició en el puerto 5055')
          PY
      - run: npm run build
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node --env-file-if-exists=.env --test tests/demo-ux.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-demo
          path: |
            docs/evidencias/demo-mayorista
            .angular/t4-evidence
          retention-days: 14

  deployment:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_PORT: '8080'
      API_PORT: '3010'
      AI_PORT: '5056'
      POSTGRES_USER: mayorista_demo
      POSTGRES_DB: mayorista_demo_ci
      DEMO_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar configuración efímera
        run: |
          demo_password="$(openssl rand -hex 24)"
          echo "::add-mask::$demo_password"
          echo "POSTGRES_PASSWORD=$demo_password" >> "$GITHUB_ENV"
          echo "COMPOSE_CONFIG_FILE=$RUNNER_TEMP/compose.json" >> "$GITHUB_ENV"
          docker compose version
      - name: Validar configuración y aislamiento
        run: |
          docker compose --env-file .env.demo.example -f compose.yaml -f compose.demo.yaml config --quiet
          docker compose --env-file .env.demo.example -f compose.yaml -f compose.demo.yaml config --format json > "$COMPOSE_CONFIG_FILE"
      - name: Construir y arrancar demo
        run: docker compose --env-file .env.demo.example -f compose.yaml -f compose.demo.yaml up -d --build
      - name: Comprobar Angular, proxy, catálogo y FastAPI
        run: node tests/deployment.smoke.cjs
      - name: Logs de diagnóstico
        if: failure()
        run: docker compose --env-file .env.demo.example -f compose.yaml -f compose.demo.yaml logs --no-color --tail 60
      - name: Detener servicios de prueba
        if: always()
        run: docker compose --env-file .env.demo.example -f compose.yaml -f compose.demo.yaml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-arranque
          path: docs/evidencias/preparacion-despliegue
          retention-days: 14
