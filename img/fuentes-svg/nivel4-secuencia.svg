<text x="36" y="69" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">Modelo C4 · Nivel 4 · UML · Pedido y reserva atómicos; pasarela fuera de la transacción SQL</text>
<text x="1964" y="40" font-size="14" fill="#64748B" font-weight="400" text-anchor="end">Diseño propuesto · v1.0</text>
