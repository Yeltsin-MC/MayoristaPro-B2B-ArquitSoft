<rect x="1675" y="120" width="270" height="80" rx="5" fill="#F2F3F5" stroke="#64748B" stroke-width="1.5"/>
<text x="1810" y="152" font-size="18" fill="#1E293B" font-weight="700" text-anchor="middle">Pasarela</text>
<text x="1810" y="179" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle">Sistema externo</text>
<path d="M1810,200 L1810,1465" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<path d="M150,250 L465,250" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="307.5" y="240" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">1. Oferta aceptada e identidad autenticada</text>
<path d="M465,295 L535,295 L535,333 L465,333" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="635" y="310" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">2. Autorizar y comprobar idempotencia</text>
<path d="M465,385 L790,385" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="627.5" y="375" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">3. Crear pedido y reserva atómicos</text>
<path d="M790,440 L1110,440" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950.0" y="430" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">4. BEGIN; revalidar y bloquear productos</text>
<rect x="25" y="480" width="1940" height="900" rx="0" fill="none" stroke="#475569" stroke-width="1.5"/>
<rect x="25" y="480" width="65" height="28" rx="0" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="38" y="500" font-size="16" fill="#1E293B" font-weight="700" text-anchor="start">alt</text>
<text x="105" y="505" font-size="16" fill="#1E293B" font-weight="700" text-anchor="start">[Stock y condiciones válidos]</text>
<path d="M790,560 L1110,560" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950.0" y="550" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">5. Guardar pedido, ítems y reserva</text>
<path d="M790,610 L1110,610" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950.0" y="600" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">6. COMMIT</text>
<path d="M465,670 L150,670" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="307.5" y="660" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">7. Pedido pendiente y vencimiento</text>
<path d="M150,740 L1430,740" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="790.0" y="730" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">8. Iniciar pago del pedido</text>
<path d="M1430,805 L1110,805" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1270.0" y="795" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">9. Persistir intento y referencia</text>
<path d="M1430,865 L1810,865" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1620.0" y="855" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">10. Solicitar pago [HTTPS]</text>
<path d="M1810,925 L1430,925" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="1620.0" y="915" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">11. Resultado verificable o pendiente</text>
<path d="M1430,985 L1110,985" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1270.0" y="975" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">12. Guardar estado del intento</text>
<rect x="420" y="1025" width="1505" height="135" rx="0" fill="#FFFBEA" stroke="#B7A54A" stroke-width="1.5"/>
<text x="440" y="1052" font-size="16" fill="#1E293B" font-weight="700" text-anchor="start">Solo ante un resultado definitivo y verificado:</text>
<path d="M1430,1095 L790,1095" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1110.0" y="1085" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">13. Aplicar resultado al pedido por contrato</text>
<path d="M790,1140 L1110,1140" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950.0" y="1130" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">14. Cambio de pedido, reserva y outbox atómicos</text>
<path d="M25,1200 L1965,1200" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="45" y="1230" font-size="16" fill="#1E293B" font-weight="700" text-anchor="start">[Stock insuficiente o conflicto]</text>
<path d="M790,1280 L1110,1280" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="950.0" y="1270" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">ROLLBACK</text>
<path d="M465,1340 L150,1340" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="307.5" y="1330" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Rechazo controlado; no se inicia pago</text>
<rect x="35" y="1500" width="1930" height="110" rx="0" fill="#FFFBEA" stroke="#B7A54A" stroke-width="1.5"/>
<text x="55" y="1530" font-size="17" fill="#1E293B" font-weight="400" text-anchor="start">Resultado pendiente: no confirma ni cancela el pedido. Pagos consulta la pasarela hasta resolver la incertidumbre.</text>
<text x="55" y="1558" font-size="16" fill="#1E293B" font-weight="400" text-anchor="start">Un rechazo definitivo libera la reserva una sola vez; una confirmación tardía exige reconciliación.</text>
<text x="55" y="1585" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">Reintentos persistidos permiten recuperarse entre el registro del intento y la actualización del pedido. Flecha discontinua: respuesta.</text>
</svg>