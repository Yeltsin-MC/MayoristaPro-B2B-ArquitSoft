<text x="790" y="179" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle">Y adaptadores</text>
<path d="M790,200 L790,1465" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="975" y="120" width="270" height="80" rx="5" fill="#EEF4FC" stroke="#64748B" stroke-width="1.5"/>
<text x="1110" y="152" font-size="18" fill="#1E293B" font-weight="700" text-anchor="middle">PostgreSQL</text>
<text x="1110" y="179" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle">Persistencia</text>
<path d="M1110,200 L1110,1465" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="1295" y="120" width="270" height="80" rx="5" fill="#EDF8F0" stroke="#64748B" stroke-width="1.5"/>
<text x="1430" y="152" font-size="18" fill="#1E293B" font-weight="700" text-anchor="middle">Módulo Pagos</text>
<text x="1430" y="179" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle">API pública</text>
