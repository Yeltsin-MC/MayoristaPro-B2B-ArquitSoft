<text x="720.0" y="1094.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">Copias temporales y sesiones.</text>
<text x="720.0" y="1114.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">No confirma stock.</text>
