<text x="930.0" y="706.0" font-size="14" fill="white" font-weight="400" text-anchor="middle">[Contenedor: NestJS · monolito modular]</text>
<text x="930.0" y="729.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">Autoriza y ejecuta los casos de uso.</text>
<text x="930.0" y="749.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">Coordina reglas de negocio e integraciones.</text>
