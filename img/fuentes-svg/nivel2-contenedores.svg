<text x="270.0" y="1094.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">Pedidos, stock e intentos de pago.</text>
<text x="270.0" y="1114.0" font-size="15" fill="white" font-weight="400" text-anchor="middle">Fuente de verdad y outbox.</text>
