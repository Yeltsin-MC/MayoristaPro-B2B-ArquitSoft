<text x="52" y="1564" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">Flecha: relación dirigida · Línea discontinua: límite del sistema/contenedor</text>
<rect x="716" y="1465" width="1248" height="125" rx="0" fill="white" stroke="#B8BDC5" stroke-width="1.5"/>
