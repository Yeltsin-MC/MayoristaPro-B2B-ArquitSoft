name: mayoristapro-demo

x-api-image: &api-image
  image: mayoristapro-demo-api:${DEMO_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deployment/Dockerfile
    target: api

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: ${API_PORT:-3000}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-mayorista}
  POSTGRES_DB: ${POSTGRES_DB:-mayorista}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env.demo}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:${AI_PORT:-5000}}
  FRONTEND_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  API_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
  MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
  REDIS_URL: ${REDIS_URL:-}
  CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-30}
  CATALOG_CACHE_TIMEOUT_MS: ${CATALOG_CACHE_TIMEOUT_MS:-100}

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mayorista}
      POSTGRES_DB: ${POSTGRES_DB:-mayorista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env.demo}
    ports: !reset []
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["node", "deployment/start.cjs", "migrate"]
    environment:
      <<: *api-environment
      DEMO_SEED: ${DEMO_SEED:-true}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ai:
    build:
      context: .
      dockerfile: deployment/ai.Dockerfile
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: ${AI_PORT:-5000}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['AI_PORT']+'/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *api-image
    environment: *api-environment
    networks: [edge, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/v1/products?limit=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *api-image
    command: ["node", "deployment/start.cjs", "worker"]
    environment:
      <<: *api-environment
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-120}
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  web:
    image: mayoristapro-demo-web:${DEMO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: web
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      API_HOST: api
      API_PORT: ${API_PORT:-3000}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: [cache]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
